# Chicago95: escritorio teal y un dialogo de inicio de sesion de Win95.

general {
    ignore_empty_input = true
}

animations {
    enabled = true
    animation = fadeIn, 0   # sin fade al bloquear
}

background {
    monitor =
    color = rgba(0, 128, 128, 1.0)
    blur_passes = 0
}

# Cuerpo del dialogo (gris, borde claro) y barra de titulo azul
shape {
    monitor =
    size = 380, 170
    color = rgb(192, 192, 192)
    rounding = 0
    border_size = 2
    border_color = rgb(223, 223, 223)
    position = 0, 0
    halign = center
    valign = center
}

shape {
    monitor =
    size = 372, 22
    color = rgb(0, 0, 128)
    rounding = 0
    border_size = 0
    position = 0, 70
    halign = center
    valign = center
}

label {
    monitor =
    text = Iniciar sesión
    color = rgb(255, 255, 255)
    font_size = 11
    font_family = Sans Bold
    position = -125, 70
    halign = center
    valign = center
}

label {
    monitor =
    text = Escriba la contraseña de $USER.
    color = rgb(0, 0, 0)
    font_size = 11
    font_family = Sans
    position = 0, 28
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 260, 26
    outline_thickness = 2
    dots_size = 0.3
    dots_spacing = 0.2
    dots_center = false
    dots_rounding = 0
    outer_color = rgb(128, 128, 128)
    inner_color = rgb(255, 255, 255)
    font_color = rgb(0, 0, 0)
    font_family = Sans
    fade_on_empty = false
    placeholder_text =
    hide_input = false
    rounding = 0
    check_color = rgb(0, 0, 128)
    fail_color = rgb(170, 0, 0)
    fail_text = <b>Contraseña incorrecta ($ATTEMPTS)</b>
    fail_timeout = 2000
    capslock_color = -1
    numlock_color = -1
    bothlock_color = -1

    position = 0, -16
    halign = center
    valign = center
}

# Reloj abajo a la derecha, como en la taskbar
label {
    monitor =
    text = cmd[update:1000] date +%H:%M
    color = rgb(255, 255, 255)
    font_size = 14
    font_family = Sans
    position = -20, 20
    halign = right
    valign = bottom
}
