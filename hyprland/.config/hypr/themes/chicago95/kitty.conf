# Chicago95: "Simbolo del sistema de MS-DOS", paleta VGA de 16 colores.
# Fuente sugerida (en kitty.conf, no aca): Less Perfect DOS VGA (viene con
# Chicago95).

foreground #c0c0c0
background #000000

color0  #000000
color8  #555555
color1  #aa0000
color9  #ff5555
color2  #00aa00
color10 #55ff55
color3  #aa5500
color11 #ffff55
color4  #0000aa
color12 #5555ff
color5  #aa00aa
color13 #ff55ff
color6  #00aaaa
color14 #55ffff
color7  #aaaaaa
color15 #ffffff

cursor #c0c0c0
cursor_text_color #000000
cursor_shape block
cursor_blink_interval 0.5

selection_foreground #ffffff
selection_background #000080

url_color #55ffff

active_border_color #000080
inactive_border_color #808080
bell_border_color #aa0000

tab_bar_style separator
tab_separator " │ "
active_tab_foreground   #ffffff
active_tab_background   #000080
active_tab_font_style   bold
inactive_tab_foreground #000000
inactive_tab_background #c0c0c0
inactive_tab_font_style normal
tab_bar_background #c0c0c0
